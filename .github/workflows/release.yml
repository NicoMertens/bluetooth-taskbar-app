# Every push to the release branch publishes the version from Directory.Build.props:
# installer and update packages go to a GitHub release, tagged vX.Y.Z, which
# installed copies poll for updates.
name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VPK_VERSION: 1.2.161
  RELEASES_DIR: _out/releases
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          # Last line only: a fresh runner may print the .NET first-run banner before it.
          $version = (dotnet msbuild source/bluetooth-taskbar-app/bluetooth-taskbar-app.csproj -getProperty:Version | Select-Object -Last 1).Trim()
          $tag = "v$version"

          # A version must never be published twice; the bump on develop was probably forgotten.
          if (git ls-remote --tags origin "refs/tags/$tag") {
            Write-Error "Tag $tag already exists. Raise <Version> in source/Directory.Build.props."
            exit 1
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish source/bluetooth-taskbar-app -c Release -r win-x64
          -p:RepositoryUrl=${{ env.REPO_URL }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release lets vpk build a delta package; the very first release has none.
      - name: Download previous release
        continue-on-error: true
        run: >
          vpk download github -o ${{ env.RELEASES_DIR }}
          --repoUrl ${{ env.REPO_URL }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack -o ${{ env.RELEASES_DIR }}
          -u bluetooth-taskbar-app
          -v ${{ steps.version.outputs.value }}
          -p _out/publish
          -e bluetooth-taskbar-app.exe
          --packTitle "Bluetooth Taskbar App"
          -i source/bluetooth-taskbar-app/Assets/app.ico
          -f net10.0-x64-desktop
          --shortcuts StartMenuRoot,Startup

      # GitHub creates the tag on the merged commit together with the release.
      - name: Upload release
        run: >
          vpk upload github -o ${{ env.RELEASES_DIR }}
          --repoUrl ${{ env.REPO_URL }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Bluetooth Taskbar App ${{ steps.version.outputs.value }}"
          --tag ${{ steps.version.outputs.tag }}
          --targetCommitish ${{ github.sha }}
