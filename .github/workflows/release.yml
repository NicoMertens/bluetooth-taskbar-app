# Builds an installer and update packages for every version tag (v1.2.3) and
# publishes them as a GitHub release, which installed copies poll for updates.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161
  RELEASES_DIR: _out/releases

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: echo "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish source/BluetoothFlyout -c Release -r win-x64
          -p:Version=${{ steps.version.outputs.value }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release lets vpk build a delta package; the very first release has none.
      - name: Download previous release
        continue-on-error: true
        run: >
          vpk download github -o ${{ env.RELEASES_DIR }}
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack -o ${{ env.RELEASES_DIR }}
          -u BluetoothFlyout
          -v ${{ steps.version.outputs.value }}
          -p _out/publish
          -e BluetoothFlyout.exe
          --packTitle "Bluetooth Flyout"
          -i source/BluetoothFlyout/Assets/app.ico
          -f net10.0-x64-desktop
          --shortcuts StartMenuRoot,Startup

      - name: Upload release
        run: >
          vpk upload github -o ${{ env.RELEASES_DIR }}
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Bluetooth Flyout ${{ steps.version.outputs.value }}"
          --tag ${{ github.ref_name }}
